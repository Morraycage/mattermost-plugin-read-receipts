services:
  db:
    image: postgres:15-alpine
    environment: {POSTGRES_USER: mm, POSTGRES_PASSWORD: mmdev, POSTGRES_DB: mattermost}
  mm:
    image: mattermost/mattermost-team-edition:${MM_VERSION:-11.11.1}
    platform: linux/amd64
    depends_on: [db]
    ports: ["127.0.0.1:8065:8065"]
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mm:mmdev@db:5432/mattermost?sslmode=disable
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
