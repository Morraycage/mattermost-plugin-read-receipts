name: Release

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/*.tar.gz
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "$GITHUB_REF_NAME" \
            --notes "Install the .tar.gz from System Console > Plugins > Plugin Management, or with \`mmctl plugin add\`. Mattermost 10.0 or later, Linux amd64 or arm64."
